<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="converter">

            <p class="heading">
                JAVASCRIPT PROJECT
            </p>

            <h1>
                Temperature Converter
            </h1>

            <p class="description">
                Convert temperature between
                Celsius, Fahrenheit and Kelvin.
            </p>


            <!-- Temperature Input -->

            <label for="temperature">
                Enter Temperature
            </label>

            <input
                type="number"
                id="temperature"
                placeholder="Enter temperature"
            >


            <!-- Unit Selection -->

            <label for="unit">
                Select Unit
            </label>

            <select id="unit">

                <option value="celsius">
                    Celsius (°C)
                </option>

                <option value="fahrenheit">
                    Fahrenheit (°F)
                </option>

                <option value="kelvin">
                    Kelvin (K)
                </option>

            </select>


            <!-- Convert Button -->

            <button onclick="convertTemperature()">

                Convert Temperature

            </button>


            <!-- Error Message -->

            <p id="error"></p>


            <!-- Results -->

            <div id="result" class="result">

                <h2>
                    Result
                </h2>

                <p>
                    Celsius:
                    <span id="celsius">
                        --
                    </span>
                </p>

                <p>
                    Fahrenheit:
                    <span id="fahrenheit">
                        --
                    </span>
                </p>

                <p>
                    Kelvin:
                    <span id="kelvin">
                        --
                    </span>
                </p>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
